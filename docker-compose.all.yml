services:
  db:
    image: postgres:16
    container_name: newsapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  fedresurs-crawler:
    build:
      context: .
      dockerfile: fedresurs-crawler/Dockerfile
    container_name: fedresurs-crawler
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      # Boost crawler throughput and timeouts for larger limits
      CRAWLER_RATE_LIMIT_RPS: "8"
      CRAWLER_REQUEST_TIMEOUT_MS: "25000"
    ports:
      - "8081:8081"
    depends_on: {}

  gosuslugi-rss:
    build:
      context: .
      dockerfile: gosuslugi-rss/Dockerfile
    container_name: gosuslugi-rss
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"
    depends_on: {}

  tg-channel-parser:
    build:
      context: .
      dockerfile: tg-channel-parser/Dockerfile
    container_name: tg-channel-parser
    restart: unless-stopped
    environment:
      SERVER_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on: {}

  news-app:
    build:
      context: .
      dockerfile: news-app/Dockerfile
    container_name: news-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # DB
      DB_URL: jdbc:postgresql://db:5432/newsdb
      DB_USER: news
      DB_PASSWORD: news
      # LLM (GigaChat)
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-gigachat_api_pers}
      GIGACHAT_TEMPERATURE: ${GIGACHAT_TEMPERATURE:-0.2}
      # Auth (provide real credentials via environment or .env file)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Comma-separated list of allowed emails
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # Ingest
      NEWS_REQUEST_TIMEOUT_MS: "300000"
      # Vaadin in production mode (no dev server)
      VAADIN_PRODUCTIONMODE: "true"
      # Force using docker-specific data script to set internal hosts
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:/data-docker.sql
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      fedresurs-crawler:
        condition: service_started
      gosuslugi-rss:
        condition: service_started
      tg-channel-parser:
        condition: service_started
volumes:
  db-data:

