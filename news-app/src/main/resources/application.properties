spring.application.name=news-app

# DataSource (override with env if needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/newsdb}
spring.datasource.username=${DB_USER:news}
spring.datasource.password=${DB_PASSWORD:news}
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# SQL init (ensure data.sql runs even with external DB)
spring.sql.init.mode=always

# Vaadin
vaadin.launch-browser=true
vaadin.allowed-packages=com.example.newsapp

server.port=${PORT:8080}

# Telegram / Dispatcher
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}
app.dispatch.enabled=${DISPATCH_ENABLED:true}
app.dispatch.fixedDelayMs=${DISPATCH_DELAY_MS:10000}
app.dispatch.batchSize=${DISPATCH_BATCH_SIZE:20}

# LLM (GigaChat via Spring AI)
# Обязательно задайте ключ через переменную окружения GIGACHAT_API_KEY
spring.ai.gigachat.auth.bearer.api-key=${GIGACHAT_API_KEY:}
# По умолчанию персональный scope
spring.ai.gigachat.auth.scope=${GIGACHAT_SCOPE:gigachat_api_pers}
# Небольшая детерминированность
spring.ai.gigachat.chat.options.temperature=${GIGACHAT_TEMPERATURE:0.2}

# News fetcher (ingest)
app.news.enabled=${NEWS_ENABLED:true}
app.news.limit=${NEWS_LIMIT:200}
app.news.windowDays=${NEWS_WINDOW_DAYS:1}
app.news.fixedDelayMs=${NEWS_POLL_DELAY_MS:60000}
app.news.requestTimeoutMs=${NEWS_REQUEST_TIMEOUT_MS:300000}
app.news.authorUsername=${NEWS_AUTHOR_USERNAME:news-bot}
app.news.authorEmail=${NEWS_AUTHOR_EMAIL:news-bot@example.com}

# Security: Google OAuth2 (client-id/secret must be provided)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# default redirect: {baseUrl}/login/oauth2/code/google
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Allowed emails (comma-separated, case-insensitive). Example: a@b.com,c@d.com
app.security.allowedEmails=${ALLOWED_EMAILS:}